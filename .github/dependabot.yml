version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Version bumps for direct dependencies only: as a Caddy plugin, go.mod
    # sets minimum versions for every build that includes it. Security
    # updates still cover indirect dependencies.
    allow:
      - dependency-type: direct
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
